name: Backend tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thinkdesk
          POSTGRES_PASSWORD: thinkdesk
          POSTGRES_DB: thinkdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
        env:
          # Placeholder config so the app boots in CI. External services are
          # mocked in tests; these values are not real credentials.
          GOOGLE_CLIENT_ID: test-google-client
          GOOGLE_CLIENT_SECRET: test-google-secret
          GOOGLE_REDIRECT_URI: http://localhost:3000/connectors/google/callback
          SLACK_CLIENT_ID: test-slack-client
          SLACK_CLIENT_SECRET: test-slack-secret
          SLACK_REDIRECT_URI: http://localhost:3000/connectors/slack/callback
          CONNECTOR_ENCRYPTION_KEY: X6g3LCr3kdDEzszRkvN14NeH900zdx9CyLMR_7Bjgtk=
          LEMONSQUEEZY_API_KEY: test-lemonsqueezy-key
          LEMONSQUEEZY_STORE_ID: "1"
          LEMONSQUEEZY_WEBHOOK_SECRET: test-webhook-secret
          LEMONSQUEEZY_VARIANT_ID: "1"
          # Tests marked live_llm run only when this repo secret is set;
          # otherwise they are skipped (see tests/conftest.py).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test-groq-key' }}
